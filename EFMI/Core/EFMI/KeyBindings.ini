namespace = EFMIv1


; Key Bindings -------------------------

[KeyHideMajorNotification]
Key = no_modifiers VK_F10
run = CommandListHideMajorNotification


[KeyToggleMods]
Key = no_modifiers VK_F11
run = CommandListToggleMods


[KeyToggleUserGuide]
key = no_modifiers VK_F12
run = CommandListToggleUserGuide


[KeyToggleHuntingModeGuide]
key = ctrl no_shift no_alt VK_F12
run = CommandListToggleHuntingModeGuide


[KeyHideNotification]
key = X
key = XB_X
run = CommandListHideNotification
